<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Event Task Board (Staff Only)</title>
<link rel="stylesheet" href="https://use.typekit.net/hte4vgd.css">
<style>
  :root { --navy:#282561; --blue:#094d9e; --line:#e4e6ee; --muted:#5a6170; --bg:#f3f4f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"proxima-nova",-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:#1d1d1f; font-size:16px; }

  header { background:#fff; border-bottom:1px solid var(--line); padding:18px 28px; }
  .hrow { display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  #eventName { font:inherit; font-size:1.5rem; font-weight:800; color:var(--navy); border:none; background:transparent; padding:0; flex:1; min-width:280px; }
  #eventName:focus { outline:none; border-bottom:2px solid var(--blue); }
  .who { color:var(--muted); font-size:14px; display:flex; gap:10px; align-items:center; }
  .progress { color:var(--muted); margin-top:4px; font-weight:700; }
  .status { color:var(--muted); font-size:13px; margin-top:4px; min-height:18px; }
  .status.err { color:#b42318; }

  main { padding:20px 28px 60px; max-width:1500px; margin:0 auto; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:18px; }
  .center { text-align:center; padding:48px 20px; max-width:560px; margin:40px auto; }
  .center h2 { color:var(--navy); margin:0 0 12px; font-size:1.4rem; }
  .muted { color:var(--muted); }

  button { font:inherit; font-size:15px; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; background:#eef1f8; color:var(--navy); font-weight:700; }
  button:hover { filter:brightness(.96); }
  button.primary { background:var(--blue); color:#fff; }
  button.danger { background:#fdecec; color:#b42318; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  .toolbar .group { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .toolbar label { color:var(--muted); font-weight:600; display:flex; gap:6px; align-items:center; }

  /* KANBAN BOARD */
  .board { display:flex; gap:16px; overflow-x:auto; align-items:flex-start; padding-bottom:12px; }
  .col { flex:0 0 310px; background:#e6e9f3; border-radius:16px; padding:10px; min-height:260px; transition:outline .1s; }
  .col.over { outline:3px dashed var(--blue); outline-offset:-3px; }
  .colhead { display:flex; align-items:center; justify-content:space-between; gap:8px; color:#fff; border-radius:10px; padding:10px 12px; font-weight:800; }
  .colhead .ctitle { font-size:16px; letter-spacing:.02em; }
  .colhead .count { font-size:13px; opacity:.9; font-weight:700; margin-left:auto; margin-right:6px; }
  .colhead button { background:rgba(255,255,255,.22); color:#fff; padding:2px 10px; font-size:18px; line-height:1.2; }
  .h-Setup { background:#00775f; }
  .h-Invitations { background:#094d9e; }
  .h-Logistics { background:#6b4fbb; }
  .h-Event-day { background:#b35300; }
  .h-custom { background:#282561; }
  .h-unsorted { background:#5a6170; }

  .cards { display:flex; flex-direction:column; gap:10px; padding-top:10px; min-height:140px; }
  .card { background:#fff; border-radius:12px; padding:14px 14px 12px; border-left:6px solid #ccc; box-shadow:0 1px 2px rgba(40,37,97,.08); cursor:grab; }
  .card:active { cursor:grabbing; }
  .card.dragging { opacity:.4; }
  .card.p-High { border-left-color:#b42318; }
  .card.p-Medium { border-left-color:#d99a00; }
  .card.p-Low { border-left-color:#00775f; }
  .card.done { opacity:.62; }
  .card.done .ctext { text-decoration:line-through; color:var(--muted); }
  .ctop { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .pill { font-size:11px; font-weight:800; border-radius:999px; padding:4px 10px; text-transform:uppercase; letter-spacing:.05em; }
  .pill.p-High { background:#fde8e6; color:#b42318; }
  .pill.p-Medium { background:#fff4d6; color:#8a6100; }
  .pill.p-Low { background:#e8f5ef; color:#00775f; }
  .ctext { font-size:16px; line-height:1.4; font-weight:600; color:#1d1d1f; margin:8px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .cmeta { display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--muted); font-size:13px; font-weight:600; min-height:0; }
  .cmeta span b { color:var(--navy); }
  .cfoot { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .edit { background:#eef1f8; padding:6px 12px; font-size:13px; }
  .chk { width:18px; height:18px; accent-color:var(--blue); cursor:pointer; }
  .drophint { color:var(--muted); font-size:13px; text-align:center; padding:24px 8px; border:2px dashed #c6cbdb; border-radius:12px; }

  /* EDIT FORM */
  .modal { position:fixed; inset:0; background:rgba(20,18,50,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal[hidden] { display:none; }
  .modal-card { background:#fff; border-radius:18px; padding:26px 28px; width:min(680px,100%); box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:92vh; overflow:auto; }
  .modal-card h3 { margin:0 0 18px; color:var(--navy); font-size:1.4rem; }
  .modal-card label { display:flex; flex-direction:column; gap:6px; font-weight:700; color:var(--navy); font-size:14px; margin-bottom:14px; }
  .modal-card input, .modal-card select, .modal-card textarea { font:inherit; font-size:16px; font-weight:400; color:#1d1d1f; border:1.5px solid #c9cfdd; border-radius:8px; padding:11px 12px; width:100%; background:#fff; }
  .modal-card textarea { resize:vertical; min-height:96px; }
  .modal-card input:focus, .modal-card select:focus, .modal-card textarea:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(9,77,158,.15); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  .chkrow { flex-direction:row !important; align-items:center; gap:10px !important; }
  .chkrow input { width:18px; height:18px; }
  .actions { display:flex; gap:10px; align-items:center; margin-top:8px; }
  .actions .spacer { flex:1; }

  @media (max-width:700px) {
    header, main { padding-left:14px; padding-right:14px; }
    .col { flex-basis:86vw; }
    .grid2 { grid-template-columns:1fr; }
  }
  .colbar { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .colbar button { font-size:12px; padding:4px 9px; background:#fff; color:var(--navy); border:1px solid #d3d8e6; }
  .colbar button:disabled { opacity:.35; cursor:default; }
  .colbar button[data-act="deleteCol"] { color:#b42318; }
  .newcol { flex:0 0 260px; background:transparent; border:2px dashed #aab1c6; color:var(--navy); border-radius:16px; padding:18px; min-height:70px; font-size:15px; }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <input id="eventName" aria-label="Event name" disabled>
    <div class="who" id="who" hidden>
      <span id="whoName"></span>
      <button type="button" id="signout">Sign out</button>
    </div>
  </div>
  <div class="progress" id="progress"></div>
  <div class="status" id="status"></div>
</header>

<main>
  <section class="panel center" id="signin">
    <h2>Staff sign-in</h2>
    <p class="muted">Sign in with your thebryc.org Google account to open the task board.</p>
    <div id="gbtn" style="display:inline-block;margin-top:14px"></div>
    <p class="muted" id="signinMsg" style="margin-top:14px;color:#b42318"></p>
  </section>

  <div id="app" hidden>
    <div class="panel toolbar">
      <div class="group">
        <button id="newBtn" class="primary" type="button">+ New task</button>
        <button id="sortBtn" type="button">Sort by priority</button>
        <label><input type="checkbox" id="hideDone"> Hide completed</label>
      </div>
      <div class="group">
        <button id="exportCsv" type="button">Export CSV</button>
      </div>
    </div>
    <div id="board" class="board"></div>
  </div>
</main>

<!-- Edit / new task form -->
<div class="modal" id="modal" hidden>
  <form class="modal-card" id="taskForm">
    <h3 id="modalTitle">New task</h3>
    <label>Task
      <textarea id="fText" rows="3" required></textarea>
    </label>
    <div class="grid2">
      <label>Column (group)
        <input id="fGroup" list="groupList" placeholder="Setup, Invitations, Logistics, Event day">
      </label>
      <label>Priority
        <select id="fPriority"><option>High</option><option>Medium</option><option>Low</option></select>
      </label>
      <label>Owner
        <input id="fOwner" placeholder="Who is doing this?">
      </label>
      <label>Due date
        <input type="date" id="fDue">
      </label>
    </div>
    <label class="chkrow"><input type="checkbox" id="fDone"> Completed</label>
    <div class="actions">
      <button type="button" class="danger" id="fDelete" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" id="fCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</div>
<datalist id="groupList"></datalist>

<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script>
<script>
  // ---- Configuration ----
  const CONFIG = {
    googleClientId: '32144070815-dlraf8atucau5biu320469otp70h8upu.apps.googleusercontent.com',
    appsScriptUrl: 'https://script.google.com/macros/s/AKfycbwYaw44_2Kke-JO9ZHYz2H87-x7yXOzfQXZU3PAZExPVWETicfaj8LcGWWZ4cbTRt_P/exec'
  };
  const SESSION_KEY = 'brycTasksSession';
  const PRI_ORDER = { High: 0, Medium: 1, Low: 2 };
  const PREFERRED_COLUMNS = ['Setup', 'Invitations', 'Logistics', 'Event day'];

  let session = sessionStorage.getItem(SESSION_KEY);
  let state = { tasks: [], columns: [], version: 0, eventName: '', lastEditor: '', hideDone: false };
  let saveTimer = null, saving = false, pendingSave = false;
  let dragId = null, editingId = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const newId = () => Date.now() * 1000 + Math.floor(Math.random() * 1000);
  const colClass = g => g === '' ? 'h-unsorted' : PREFERRED_COLUMNS.includes(g) ? 'h-' + g.replace(/ /g, '-') : 'h-custom';
  const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' });

  // ---- Server calls ----
  async function api(action, data = {}) {
    const res = await fetch(CONFIG.appsScriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: session, ...data })
    });
    const out = await res.json();
    if (out.error === 'unauthorized') { signOut('Your session expired. Please sign in again.'); throw new Error('unauthorized'); }
    if (out.error) { const e = new Error(out.error); e.conflict = out.error === 'conflict'; throw e; }
    return out;
  }

  // ---- Sign-in ----
  function initGoogle() {
    google.accounts.id.initialize({ client_id: CONFIG.googleClientId, callback: onCredential });
    google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with' });
    if (session) boot(); else showSignin();
  }

  async function onCredential(resp) {
    $('signinMsg').textContent = '';
    try {
      const out = await api('signin', { credential: resp.credential });
      session = out.token;
      sessionStorage.setItem(SESSION_KEY, session);
      $('whoName').textContent = out.name;
      boot();
    } catch (e) {
      $('signinMsg').textContent = e.message;
    }
  }

  function showSignin() {
    $('app').hidden = true; $('signin').hidden = false; $('who').hidden = true; $('eventName').disabled = true;
  }

  function signOut(message) {
    sessionStorage.removeItem(SESSION_KEY);
    session = null;
    showSignin();
    if (message) $('signinMsg').textContent = message;
  }
  $('signout').addEventListener('click', () => signOut(''));

  // ---- Load and save ----
  async function boot() {
    try {
      const out = await api('load');
      state.tasks = out.tasks; state.version = out.version; state.eventName = out.eventName; state.lastEditor = out.lastEditor;
      state.columns = (out.columns || []).slice();
      state.tasks.forEach(t => { const g = (t.group || '').trim(); if (g && !state.columns.includes(g)) state.columns.push(g); });
      $('eventName').value = state.eventName;
      $('signin').hidden = true; $('app').hidden = false; $('who').hidden = false; $('eventName').disabled = false;
      setStatus(state.lastEditor ? `Last saved by ${state.lastEditor}` : 'Ready', false);
      render();
    } catch (e) {
      if (e.message !== 'unauthorized') setStatus('Could not load the board. Please refresh.', true);
    }
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    setStatus('Saving…', false);
    saveTimer = setTimeout(doSave, 700);
  }

  async function doSave() {
    if (saving) { pendingSave = true; return; }
    saving = true;
    try {
      const out = await api('save', { baseVersion: state.version, tasks: state.tasks, columns: state.columns, eventName: state.eventName });
      state.version = out.version; state.lastEditor = out.lastEditor;
      setStatus(`All changes saved at ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`, false);
    } catch (e) {
      if (e.message === 'unauthorized') { /* handled in api() */ }
      else if (e.conflict) {
        setStatus('Someone else saved changes. Reloading the latest version. Re-enter your last edit if it is missing.', true);
        setTimeout(boot, 1500);
      } else {
        setStatus('Not saved. Check your connection; your next change will try again.', true);
      }
    } finally {
      saving = false;
      if (pendingSave) { pendingSave = false; doSave(); }
    }
  }

  function setStatus(msg, isErr) {
    $('status').textContent = msg;
    $('status').className = 'status' + (isErr ? ' err' : '');
  }

  // ---- Columns and cards ----
  function columns() {
    const cols = [...state.columns];
    if (state.tasks.some(t => !(t.group || '').trim())) cols.push('');
    return cols;
  }

  function cardHTML(t) {
    return `
      <article class="card p-${t.priority}${t.done ? ' done' : ''}" draggable="true" data-id="${t.id}">
        <div class="ctop">
          <input type="checkbox" class="chk" data-act="toggle" ${t.done ? 'checked' : ''} aria-label="Completed">
          <span class="pill p-${t.priority}">${t.priority}</span>
        </div>
        <div class="ctext">${esc(t.text)}</div>
        <div class="cmeta">
          ${t.owner ? `<span>Owner: <b>${esc(t.owner)}</b></span>` : ''}
          ${t.due ? `<span>Due: <b>${fmtDate(t.due)}</b></span>` : ''}
        </div>
        <div class="cfoot">
          <span></span>
          <button type="button" class="edit" data-act="edit">Edit</button>
        </div>
      </article>`;
  }

  function render() {
    const board = $('board');
    board.innerHTML = columns().map(col => {
      const tasks = state.tasks.filter(t => (t.group || '').trim() === col);
      const done = tasks.filter(t => t.done).length;
      const visible = tasks.filter(t => !(state.hideDone && t.done));
      const label = col === '' ? 'Unsorted' : col;
      const idx = state.columns.indexOf(col);
      const bar = col === '' ? '' : `
        <div class="colbar">
          <button type="button" data-act="rename" data-group="${esc(col)}">Rename</button>
          <button type="button" data-act="moveLeft" data-group="${esc(col)}" ${idx <= 0 ? 'disabled' : ''} title="Move left">&#8592;</button>
          <button type="button" data-act="moveRight" data-group="${esc(col)}" ${idx >= state.columns.length - 1 ? 'disabled' : ''} title="Move right">&#8594;</button>
          <button type="button" data-act="deleteCol" data-group="${esc(col)}">Delete</button>
        </div>`;
      return `
        <section class="col" data-group="${esc(col)}">
          <div class="colhead ${colClass(col)}">
            <span class="ctitle">${esc(label)}</span>
            <span class="count">${done}/${tasks.length}</span>
            <button type="button" data-act="addInCol" data-group="${esc(col)}" title="Add task to ${esc(label)}">+</button>
          </div>
          ${bar}
          <div class="cards">
            ${visible.map(cardHTML).join('') || '<div class="drophint">Drop tasks here</div>'}
          </div>
        </section>`;
    }).join('') + '<button type="button" class="newcol" data-act="addCol">+ Add column</button>';

    const datalist = $('groupList');
    datalist.innerHTML = columns().filter(Boolean).map(g => `<option value="${esc(g)}">`).join('');
    renderProgress();
  }

  function renderProgress() {
    const done = state.tasks.filter(t => t.done).length;
    $('progress').textContent = `${done} of ${state.tasks.length} tasks done`;
  }

  function changed(rerender) {
    if (rerender) render(); else renderProgress();
    scheduleSave();
  }

  // Move a task into a column, before another task (or to the end of the column)
  function moveTask(id, group, beforeId) {
    if (id === beforeId) return;
    const from = state.tasks.findIndex(t => t.id === id);
    if (from < 0) return;
    const [task] = state.tasks.splice(from, 1);
    task.group = group;
    if (beforeId != null) {
      const at = state.tasks.findIndex(t => t.id === beforeId);
      state.tasks.splice(at < 0 ? state.tasks.length : at, 0, task);
    } else {
      let last = -1;
      state.tasks.forEach((t, k) => { if ((t.group || '').trim() === group) last = k; });
      state.tasks.splice(last + 1, 0, task);
    }
    changed(true);
  }

  // Board events: checkboxes, edit, add-in-column
  $('board').addEventListener('change', e => {
    if (e.target.dataset.act !== 'toggle') return;
    const id = Number(e.target.closest('.card').dataset.id);
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    t.done = e.target.checked;
    changed(true);
  });

  $('board').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const act = btn.dataset.act, g = btn.dataset.group;
    if (act === 'edit') openModal(Number(btn.closest('.card').dataset.id));
    else if (act === 'addInCol') openModal(null, g);
    else if (act === 'rename') renameColumn(g);
    else if (act === 'deleteCol') deleteColumn(g);
    else if (act === 'moveLeft') moveColumn(g, -1);
    else if (act === 'moveRight') moveColumn(g, 1);
    else if (act === 'addCol') addColumn();
  });

  function renameColumn(oldName) {
    const name = prompt('Rename column', oldName);
    if (name == null) return;
    const n = name.trim().slice(0, 40);
    if (!n || n === oldName) return;
    if (state.columns.includes(n)) { alert('A column with that name already exists.'); return; }
    state.columns[state.columns.indexOf(oldName)] = n;
    state.tasks.forEach(t => { if ((t.group || '').trim() === oldName) t.group = n; });
    changed(true);
  }

  function deleteColumn(name) {
    const count = state.tasks.filter(t => (t.group || '').trim() === name).length;
    const msg = count
      ? `Delete "${name}"? Its ${count} task(s) will move to Unsorted.`
      : `Delete "${name}"?`;
    if (!confirm(msg)) return;
    state.tasks.forEach(t => { if ((t.group || '').trim() === name) t.group = ''; });
    state.columns = state.columns.filter(c => c !== name);
    changed(true);
  }

  function moveColumn(name, dir) {
    const i = state.columns.indexOf(name), j = i + dir;
    if (i < 0 || j < 0 || j >= state.columns.length) return;
    [state.columns[i], state.columns[j]] = [state.columns[j], state.columns[i]];
    changed(true);
  }

  function addColumn() {
    const name = prompt('New column name');
    if (name == null) return;
    const n = name.trim().slice(0, 40);
    if (!n) return;
    if (state.columns.includes(n)) { alert('A column with that name already exists.'); return; }
    state.columns.push(n);
    changed(true);
  }

  // Drag and drop between and within columns
  $('board').addEventListener('dragstart', e => {
    const card = e.target.closest('.card'); if (!card) return;
    dragId = Number(card.dataset.id);
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(dragId));
  });

  $('board').addEventListener('dragend', () => {
    document.querySelectorAll('.card.dragging').forEach(c => c.classList.remove('dragging'));
    document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over'));
    dragId = null;
  });

  $('board').addEventListener('dragover', e => {
    const col = e.target.closest('.col'); if (!col || dragId == null) return;
    e.preventDefault();
    document.querySelectorAll('.col.over').forEach(c => { if (c !== col) c.classList.remove('over'); });
    col.classList.add('over');
  });

  $('board').addEventListener('dragleave', e => {
    const col = e.target.closest('.col');
    if (col && !col.contains(e.relatedTarget)) col.classList.remove('over');
  });

  $('board').addEventListener('drop', e => {
    const col = e.target.closest('.col'); if (!col || dragId == null) return;
    e.preventDefault();
    col.classList.remove('over');
    const group = col.dataset.group;
    const card = e.target.closest('.card');
    if (card) {
      moveTask(dragId, group, Number(card.dataset.id));
    } else {
      moveTask(dragId, group, null);
    }
    dragId = null;
  });

  // ---- Edit / new task form ----
  function openModal(id, group = '') {
    editingId = id;
    const t = id != null ? state.tasks.find(x => x.id === id) : null;
    $('modalTitle').textContent = t ? 'Edit task' : 'New task';
    $('fText').value = t ? t.text : '';
    $('fGroup').value = t ? (t.group || '') : group;
    $('fPriority').value = t ? t.priority : 'Medium';
    $('fOwner').value = t ? (t.owner || '') : '';
    $('fDue').value = t ? (t.due || '') : '';
    $('fDone').checked = t ? !!t.done : false;
    $('fDelete').hidden = !t;
    $('modal').hidden = false;
    setTimeout(() => $('fText').focus(), 30);
  }

  function closeModal() {
    $('modal').hidden = true;
    editingId = null;
  }

  $('newBtn').addEventListener('click', () => openModal(null, ''));
  $('fCancel').addEventListener('click', closeModal);
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });

  $('taskForm').addEventListener('submit', e => {
    e.preventDefault();
    const data = {
      text: $('fText').value.trim(),
      group: $('fGroup').value.trim(),
      priority: $('fPriority').value,
      owner: $('fOwner').value.trim(),
      due: $('fDue').value,
      done: $('fDone').checked
    };
    if (!data.text) return;
    if (data.group && !state.columns.includes(data.group)) state.columns.push(data.group);
    if (editingId != null) {
      const t = state.tasks.find(x => x.id === editingId);
      if (t) Object.assign(t, data);
    } else {
      state.tasks.push({ id: newId(), ...data });
    }
    closeModal();
    changed(true);
  });

  $('fDelete').addEventListener('click', () => {
    if (editingId == null) return;
    if (!confirm('Delete this task?')) return;
    state.tasks = state.tasks.filter(t => t.id !== editingId);
    closeModal();
    changed(true);
  });

  // ---- Toolbar ----
  $('eventName').addEventListener('input', e => { state.eventName = e.target.value; scheduleSave(); });

  $('sortBtn').addEventListener('click', () => {
    state.tasks.sort((a, b) => PRI_ORDER[a.priority] - PRI_ORDER[b.priority]);
    changed(true);
  });

  $('hideDone').addEventListener('change', e => { state.hideDone = e.target.checked; render(); });

  $('exportCsv').addEventListener('click', () => {
    const cols = ['Column', 'Done', 'Priority', 'Task', 'Owner', 'Due'];
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const lines = [cols.join(',')].concat(state.tasks.map(t =>
      [t.group, t.done ? 'Yes' : 'No', t.priority, t.text, t.owner, t.due].map(q).join(',')));
    const url = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
    const a = document.createElement('a'); a.href = url; a.download = 'event-tasks.csv'; a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
